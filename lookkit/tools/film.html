<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'NSans';src:url(/core/fonts/NotoSansSC-VF.ttf)}
@font-face{font-family:'NSerif';src:url(/core/fonts/NotoSerifSC-VF.otf)}
@font-face{font-family:'Brush';src:url(/core/fonts/MaShanZheng.ttf)}
@font-face{font-family:'XiaoWei';src:url(/core/fonts/ZCOOLXiaoWei.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
const q=new URLSearchParams(location.search);
await Promise.all(['NSans','NSerif','Brush','XiaoWei'].map(f=>document.fonts.load(`40px ${f}`,'道歉对不起堵车')));
try{
  const m=await import(`/presets/${q.get('preset')}/film.js`);
  const i=+q.get('shot'); const sh=m.SHOTS[i]; const c=document.getElementById('c'); const ctx=c.getContext('2d');
  const t0=performance.now(); const st=await sh.build(); const env=m.ENV?await m.ENV():{};
  window.BUILD_MS=performance.now()-t0;
  window.frame=(f)=>{ const t=f/30; const lt=Math.min(.9999,(t-sh.t0)/(sh.t1-sh.t0)); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
    sh.frame(ctx,lt,st,{f,t,env}); m.POST(ctx,lt,sh,{f,t,env}); return c.toDataURL('image/jpeg',.92); };
  window.__done='ok';
}catch(e){console.error(e);window.__done='err:'+e.stack}
</script></body></html>
